<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libreta de tu Mascota · Orbit</title>
<meta name="description" content="Todo lo de tu mascota en un lugar: salud, medicación, comida, gastos, viajes, modo cuidador y modo perdida.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F6F1">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter+Tight:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/mascotas.css?v=6">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Orbit">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74.6 80.5A39 39 0 1 1 89 50" fill="none" stroke="#1F2A24" stroke-width="22"/><circle cx="75" cy="80" r="12.5" fill="#3047FF"/></svg><b>Orbit</b>
  </a>
  <span class="tag">Libreta de tu Mascota</span>
  <span class="sp"></span>
  <button class="save" id="save" type="button" aria-live="polite"></button>
</header>
<div class="demo" id="demo" hidden>
  <span><b>Estás viendo una demo.</b> Lo que cargues no se guarda.</span>
  <span id="demoCta"></span>
</div>

<main id="app"></main>

<dialog id="dForm" aria-labelledby="dFormT"><form class="sheet" id="fForm" novalidate>
  <div class="sheet-h"><h2 id="dFormT"></h2><button class="x" type="button" data-close aria-label="Cerrar">×</button></div>
  <div id="fBody" class="fbody"></div>
  <p class="err-msg" id="fErr" role="alert" hidden></p>
  <button class="btn blue wide" type="submit" id="fSave">Guardar</button>
  <button class="btn danger wide" type="button" id="fDel" hidden>Borrar</button>
</form></dialog>

<dialog id="dPanel" aria-labelledby="dPanelT"><div class="sheet">
  <div class="sheet-h"><h2 id="dPanelT"></h2><button class="x" type="button" data-close aria-label="Cerrar">×</button></div>
  <div id="pBody" class="fbody"></div>
</div></dialog>

<div class="toast" id="toast" role="status"></div>
<div id="qrScratch" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/assets/js/mascotas-core.js?v=6"></script>
<script src="/assets/js/mascotas-app.js?v=6"></script>
</body>
</html>
