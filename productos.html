<style>
.cat-head{min-height:max(620px,100svh);padding-top:calc(88px + env(safe-area-inset-top,0px));padding-bottom:28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.cat-head .top{display:flex;justify-content:space-between;gap:20px}
.cat-head h1{font-size:clamp(56px,min(11vw,17vh),200px);margin:0}
.cat-head h1 .it{color:var(--or)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:clamp(14px,2.4vw,40px);align-items:end;perspective:1600px}
.shelf a{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;align-items:flex-start}
.shelf .cv{width:100%;max-width:calc(46vh * .75);perspective:1400px}
.flip{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transform:rotateY(-10deg);transform-origin:center;transition:transform .85s var(--ease)}
.shelf a:hover .flip,.shelf a:focus-visible .flip,.flip.flipped{transform:rotateY(180deg) translateY(-10px)}
.shelf a:hover .face,.shelf a:focus-visible .face,.flip.flipped .face{box-shadow:0 26px 46px -24px rgba(48,71,255,.6)}
.face{transition:box-shadow .6s var(--ease)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(.6px)}
.face *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg) translateZ(.6px);background:var(--k);color:var(--b);padding:11% 10% 9%;display:flex;flex-direction:column;justify-content:space-between;gap:14px;container-type:inline-size;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(242,239,232,.14)}
.face.back .pg{position:absolute;left:0;top:1.4cqw;bottom:1.4cqw;width:3.4cqw;z-index:3;background:repeating-linear-gradient(90deg,#efece4 0 1px,rgba(0,0,0,.45) 1px 2.6px);box-shadow:inset -2px 0 4px rgba(0,0,0,.55)}
/* canto superior de hojas: la línea clara del libro */
.face.back::before{content:"";position:absolute;left:1.4cqw;right:5cqw;top:0;height:1.6cqw;z-index:3;background:linear-gradient(180deg,#f6f3ec,#cdc9c0 60%,rgba(0,0,0,.55));border-radius:1px}
/* sombra del lomo, del lado derecho de la contratapa */
.face.back::after{content:"";position:absolute;right:0;top:0;bottom:0;width:9cqw;z-index:2;background:linear-gradient(270deg,rgba(0,0,0,.65),rgba(0,0,0,0));pointer-events:none}
.face.back .mono{font-size:max(9px,3.4cqw);letter-spacing:.08em;line-height:1.5}
.face.back p{margin:0;font-family:var(--serif);font-style:italic;font-size:9cqw;line-height:1.12;letter-spacing:-.02em}
.face.back ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2cqw;font-size:max(9px,3.2cqw);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.face.back .bf{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.face.back .bf b{font-size:max(13px,5cqw);font-weight:700;letter-spacing:-.02em}
.qbtn{display:none;margin-top:10px;align-self:flex-start}
@media (hover:none){.shelf a:hover .flip{transform:rotateY(-10deg)}.qbtn{display:inline-flex}}
.shelf a:nth-child(2) .cv{transition-delay:.02s}
.shelf a:hover .cv,.shelf a:focus-visible .cv{transform:rotateY(0) translateY(-14px);box-shadow:0 40px 70px -30px rgba(48,71,255,.5)}
.shelf .pr{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.3vw,20px);line-height:1.15;max-width:22ch}
.shelf .pr s{text-decoration:none;background:linear-gradient(var(--or),var(--or)) 0 58%/100% 2px no-repeat}
.shelf .to{display:flex;justify-content:space-between;gap:10px;width:100%;border-top:1px solid var(--k3);padding-top:10px}
.shelf .to b{font-weight:800;letter-spacing:-.03em;text-transform:uppercase;font-size:clamp(14px,1.2vw,18px)}
.cat-head .base{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.cat-head .base .lead{margin:0;opacity:.75;max-width:52ch;font-size:clamp(15px,1.2vw,18px)}
@media (max-width:860px){.cat-head{height:auto;min-height:100svh}.shelf{grid-template-columns:1fr 1fr;row-gap:28px}.shelf .cv{width:100%}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:clamp(28px,4vw,48px)}
.filters .l{display:flex;flex-wrap:wrap;gap:8px}
#grid{display:grid;gap:clamp(48px,7vw,96px)}
.grupo{scroll-margin-top:100px}
.grupo .cab{display:grid;gap:8px;padding-bottom:clamp(18px,2.6vw,30px);
  border-bottom:1px solid var(--k3);margin-bottom:clamp(22px,3vw,38px)}
.grupo .cab .nn{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;opacity:.45}
.grupo .cab h2{margin:0;font-size:clamp(28px,4.6vw,56px);font-weight:800;
  letter-spacing:-.04em;line-height:1;text-transform:uppercase}
.grupo .cab p{margin:0;max-width:46ch;opacity:.65;font-size:clamp(14px,1.1vw,16px);line-height:1.45}
.grupo .nada{margin:0;padding:clamp(22px,3vw,38px) 0;opacity:.5;font-style:italic;
  font-family:var(--serif);font-size:clamp(16px,1.4vw,21px)}
.filters .l a.chip{text-decoration:none}
.grupo .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.grupo .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grupo .pgrid{grid-template-columns:1fr}}
.soon{margin-top:clamp(56px,7vw,110px);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);background:var(--k);color:var(--b);min-height:360px}
.soon .t{padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.soon h2{font-size:clamp(46px,6vw,100px)}
.soon .photo{min-height:300px}
@media (max-width:860px){.cat-head .top,.soon{grid-template-columns:1fr}}
</style>
</head>
<body data-page="productos" data-title-es="Productos — Orbit®" data-title-en="Products — Orbit®">
<main>
<section class="sec dark cat-head">
  <div class="wrap top"><span class="mono">Vol.01 — 2026</span><span class="mono" style="text-align:right" id="count"></span></div>
  <div class="wrap"><h1 class="display"><span data-l="es">La <span class="it">colección.</span></span><span data-l="en">The <span class="it">collection.</span></span></h1></div>
  <div class="wrap shelf" id="shelf"></div>
  <div class="wrap base"><p class="lead"><span data-l="es">Cada herramienta nace de un problema real. Elegí el tuyo.</span><span data-l="en">Every tool starts with a real problem. Pick yours.</span></p><a class="mono" href="#grid" style="text-decoration:none"><span data-l="es">Ver catálogo completo ↓</span><span data-l="en">See full catalog ↓</span></a></div>
</section>

<section class="sec light">
  <div class="wrap">
    <div class="filters"><div class="l" id="filt" role="group" aria-label="Filtro"></div><span class="mono dim">Vol.01 — 2026</span></div>
    <div id="grid"></div>

  </div>
</section>
</main>
<script src="assets/js/products.js?v=54"></script>
<script src="/api/catalog"></script>
<script src="assets/js/orbit.js?v=56"></script>
<script>
(() => {
const {$, $$, L, tr, card, reveal, P, FAM} = ORBIT;
const {cover, url, C} = ORBIT;
const PO = ORBIT.ordenados().filter(p => p.status !== 'soon');
$('#shelf').innerHTML = PO.map(p => `<a href="${url(p)}"><div class="cv"><div class="flip"><div class="face front">${cover(p)}</div><div class="face back"><span class="pg"></span>
  <span class="mono">${p.code}<br>Digital goods</span>
  <p>${L(p.tagline)}</p>
  <ul>${p.includes.slice(0,3).map(([t]) => `<li>${L(t)}</li>`).join('')}</ul>
  <div><span class="mono">Orbit® — ${L('Ideas en movimiento','Ideas in motion')}<br>Est. 2026</span><div class="bf" style="margin-top:3cqw"><b>${p.status==='soon' ? L('Pronto','Soon') : ORBIT.money(p)}</b><span class="mono">${L('Ver detalle','See details')} →</span></div></div>
</div></div></div><span class="to"><b>${p.name}</b><span class="mono dim">${p.status==='soon' ? L('Pronto','Soon') : ORBIT.money(p)}</span></span>
<button class="chip qbtn" type="button" data-flip>${L('¿Qué es?','What is it?')}</button></a>`).join('');
$$('#shelf [data-flip]').forEach(b => b.onclick = e => { e.preventDefault(); const f = $('.flip', b.closest('a')); f.classList.toggle('flipped'); b.innerHTML = f.classList.contains('flipped') ? L('Ver tapa','Show cover') : L('¿Qué es?','What is it?'); });
const grid = $('#grid'), filt = $('#filt');

/* El catálogo se agrupa por oficio (nicho), en el orden de la escalera:
   entrada → ancla → complemento. Lo que todavía no tiene nicho (o está por
   salir) va al final, en "Próximamente". */
const GRUPOS = ORBIT.nichos().map(n => ({id:n.id, n:n.n, d:n.d, lista:n.items}));
const resto = P.filter(p => !GRUPOS.some(g => g.lista.includes(p)));
if (resto.length) GRUPOS.push({id:'pronto', n:{es:'Próximamente', en:'Coming soon'},
  d:{es:'Lo que estamos terminando.', en:'What we are finishing.'}, lista:resto});
filt.innerHTML = GRUPOS.map((t, i) =>
  `<a class="chip" href="#${t.id}">${String(i + 1).padStart(2, '0')} ${L(t.n)}</a>`).join('');

function pintar() {
  grid.innerHTML = GRUPOS.map((t, i) => {
    const lista = t.lista;
    return `<section class="grupo" id="${t.id}">
      <div class="cab">
        <span class="nn">${String(i + 1).padStart(2, '0')}</span>
        <h2>${L(t.n)}</h2>
        <p>${L(t.d)}</p>
      </div>
      ${lista.length
        ? `<div class="pgrid">${lista.map(card).join('')}</div>`
        : `<p class="nada">${L('Todavía no hay nada en este escalón.','Nothing on this step yet.')}</p>`}
    </section>`;
  }).join('');
  $$('.rv', grid).forEach(el => el.classList.remove('rv'));
  const n = P.filter(p => p.status !== 'soon').length;
  $('#count').textContent = `${n} ${n === 1 ? tr('producto disponible','product available') : tr('productos disponibles','products available')}`;
}
pintar();
addEventListener('orbit:lang', pintar);
reveal();
})();
</script>
</body>
</html>
