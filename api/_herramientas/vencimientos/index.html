  <button type="button" data-tab="inicio" aria-current="page"><svg><use href="#i-inicio"/></svg><span>Inicio</span></button>

    <div class="hoja-top">
      <h2 id="hoja-t" class="hoja-titulo"></h2>

    </div>
    <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
  </div>
</dialog>
