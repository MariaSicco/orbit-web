<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha de mascota · Mimitos</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F3EE">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/mascotas.css?v=43">
<link rel="stylesheet" href="/assets/css/mascotas-hoy.css?v=4">
</head>
<body>
<header class="top">
  <a class="brand mimi" href="/mascotas" aria-label="Mimitos"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27.5c-6.3-4.2-11-8.3-11-13.4C5 10.6 7.7 8 10.9 8c2.2 0 4 1.1 5.1 2.9C17.1 9.1 18.9 8 21.1 8 24.3 8 27 10.6 27 14.1c0 5.1-4.7 9.2-11 13.4z" fill="#E2734A"/><circle cx="12" cy="16" r="1.6" fill="#2B2119"/><circle cx="20" cy="16" r="1.6" fill="#2B2119"/><path d="M14 19.6c1.1.9 2.9.9 4 0" fill="none" stroke="#2B2119" stroke-width="1.5" stroke-linecap="round"/></svg><b>mimitos</b></a>
  <span class="sp"></span>
  <span class="tag" id="kindTag"></span>
</header>
<main id="app"><p class="dim">Cargando…</p></main>
<footer class="made">hecho con <a href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74.6 80.5A39 39 0 1 1 89 50" fill="none" stroke="#2B2119" stroke-width="22"/><circle cx="75" cy="80" r="12.5" fill="#3047FF"/></svg>Orbit</a></footer>
<div class="toast" id="toast" role="status"></div>
<script src="/assets/js/mascotas-rules.js?v=32"></script>
<script src="/assets/js/mascotas-core.js?v=32"></script>
<script src="/assets/js/mascotas-hoy.js?v=3"></script>
<script>
(() => {
'use strict';
const Z = window.MZ, { esc, fmt, TYPE } = Z, app = document.getElementById('app');
const parts = location.pathname.split('/').filter(Boolean);
const kind = parts[0] === 'cuida' ? 'c' : 's', token = (parts[1] || new URLSearchParams(location.search).get(kind) || '').replace(/[^A-Za-z0-9_-]/g, '');
const tel = s => String(s || '').replace(/[^\d+]/g, '');
const wa = s => tel(s).replace(/^\+/, '');
function toast(t, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(t)}</span>${action ? `<button type="button">${esc(action.label || 'Deshacer')}</button>` : ''}`;
  el.classList.toggle('act', Boolean(action));
  if (action) el.querySelector('button').onclick = () => { el.classList.remove('on'); action.fn(); };
  el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), action ? 8000 : 2800);
}
const photo = p => p.photo ? `<img class="hero-photo" src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">` : '';
const state = (h, t) => { app.innerHTML = `<div class="empty" role="status"><h2>${h}</h2><p>${t}</p></div>`; };
const notFound = () => state('Este link ya no está activo', kind === 'c' ? 'Puede que la familia lo haya apagado. Pedile uno nuevo.' : 'Puede que la persona lo haya apagado. Pedile uno nuevo.');
/* el link del cuidador vence solo unos días después de la fecha de vuelta (el servidor responde 404 con error de vencido) */
const expired = () => state('Este link venció', 'Pasaron los días para los que la familia te lo mandó. Si la seguís cuidando, pediles uno nuevo.');
/* la ficha llegó pero tiene datos viejos o incompletos: no es un problema de la conexión de quien la abre */
const broken = () => state('No pudimos mostrar esta ficha', kind === 'c' ? 'Faltan datos en la ficha del cuidador. Pedile a la familia que revise en Mimitos los datos para el cuidador y te mande el link de nuevo.' : 'Faltan datos en esta ficha. Si es tuya, abrila en Mimitos y guardala de nuevo.');

async function load() {
  if (!token) return notFound();
  let r, d;
  try { r = await fetch(`/api/mascotas?${kind}=${token}`); d = await r.json().catch(() => null); }
  catch { return state('No pudimos cargar la ficha', 'Revisá tu conexión y recargá la página.'); }
  if (r.status === 404 || r.status === 410) return d?.expired || /venc|expir/i.test(d?.error || '') ? expired() : notFound();
  if (!r.ok || !d?.pet) return r.status >= 500 ? state('No pudimos cargar la ficha', 'Puede ser un problema nuestro. Probá de nuevo en un rato.') : notFound();
  try { kind === 's' ? ficha(d.pet, d.updatedAt, d.owner) : cuidador(d.pet, d.until, d.hoy); }
  catch (e) { console.warn('[mimitos] ficha incompleta', e?.message); broken(); }
}

/* ficha pública del QR del collar: solo lo necesario para que la devuelvan */
const I = Z.icon, bubble = (ic, c) => `<span class="ib c-${c}">${I(ic)}</span>`;
const av = p => `<div class="av big">${p.photo ? `<img src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">` : Z.petIcon(p)}</div>`;
let F = null, here = null;
/* el mismo color que la familia eligió para su mascota (texto encima siempre en tinta) */
const HUES = { azul: '#4A90E2', verde: '#34A574', rosa: '#F2789F', lila: '#A58BF0', naranja: '#FF8A4C', amarillo: '#F5C430', turquesa: '#2FB5C0' };
function ficha(p, updatedAt, owner) {
  F = p;
  document.title = `${p.name} · ¿La encontraste?`;
  const ella = p.sex === 'm' ? 'lo' : 'la', perdid = p.sex === 'm' ? 'perdido' : 'perdida';
  const facts = [['Especie', Z.species(p)], ['Raza', p.breed], ['Sexo', p.sex === 'h' ? 'Hembra' : p.sex === 'm' ? 'Macho' : ''], ['Color', p.color], ['Señas', p.marks]].filter(f => f[1]);
  const c = p.contact;
  const callBtns = msg => c?.phone ? `<div class="qr-call"><a class="btn big" href="tel:${esc(tel(c.phone))}">${I('phone')} Llamar a ${esc(c.name || 'su familia')}</a><a class="btn big ghost" href="https://wa.me/${esc(wa(c.phone))}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${I('chat')} Mandar WhatsApp</a></div>` : '';
  const extra = (p.photos || []).filter(u => u && u !== p.photo).slice(0, 3);
  app.innerHTML = `
    ${owner ? `<p class="banner ok-b" style="font-size:14px">${bubble('qr', 'viaje')}<span>Así ve tu ficha quien escanea el QR. Tu visita no cuenta como escaneo.</span></p>` : ''}
    ${p.lost ? `<section class="banner lost qr-lost"><span class="eyebrow">Se perdió</span><h1>Estoy ${perdid}</h1><p>${p.lost.since ? 'Desde ' + esc(Z.fmtWhen(new Date(p.lost.since))) : ''}${p.lost.place ? (p.lost.since ? ', ' : '') + esc(p.lost.place) : ''}${p.lost.since || p.lost.place ? '.' : ''}${p.lost.note ? ' ' + esc(p.lost.note) : ''}</p><p><b>Si me ves, no me persigas.</b> Avisale a mi familia.</p></section>` : ''}
    <section class="qr-hero${p.photo && (p.cut || p.photoFull) ? ' cut' : ''}" style="--hero:${HUES[p.hue] || HUES.azul}">
      <div class="qh-stage">${p.photo ? `<img src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">` : `<span class="qh-ic">${Z.petIcon(p)}</span>`}</div>
      <div class="qh-txt"><p class="hello">${p.lost ? 'Me están buscando' : '¡Hola! Me llamo'}</p><h1>${esc(p.name)}</h1>
      ${p.temper ? `<div class="pills"><span class="pill">${esc(p.temper)}</span></div>` : ''}
      ${extra.length ? `<div class="qr-photos">${extra.map(u => `<img src="${esc(u)}" alt="Otra foto de ${esc(p.name)}" loading="lazy">`).join('')}</div>` : ''}</div></section>
    <section class="qr-here${p.lost ? ' lost' : ''}" id="hereBox" aria-live="polite">${hereHtml()}</section>
    ${p.urgent ? `<section class="banner qr-urgent" role="note">${bubble('alert', 'perdida')}<span><b>Importante</b>${esc(p.urgent)}</span></section>` : ''}
    <section class="card qr-contact">
      <h2>¿${p.lost ? 'Me viste' : 'Me encontraste'}? Avisale a mi familia</h2>
      ${c?.phone ? `<p class="dim">${esc(c.name || 'Mi familia')}${c.note ? '. ' + esc(c.note) : ''}</p>${callBtns(`Hola, encontré a ${p.name}. Escaneé el QR de su collar.`)}`
        : `<p class="dim">Su familia no dejó un teléfono a la vista. Usá el aviso de abajo: le llega al instante.</p>`}
    </section>
    <section class="card qr-form" id="found" aria-labelledby="hFound">
      <h2 id="hFound">¿Querés dejarle algo más? <span class="opt">(opcional)</span></h2>
      <p class="dim">Tu nombre, tu teléfono o un mensaje. Le llega solo a su familia, en el celu y por mail.</p>
      <div class="f"><label for="fName">Tu nombre <span class="opt">(opcional)</span></label><input id="fName" maxlength="60" autocomplete="name"></div>
      <div class="f"><label for="fPhone">Tu teléfono <span class="opt">(opcional)</span></label><input id="fPhone" type="tel" maxlength="40" autocomplete="tel" inputmode="tel"></div>
      <div class="f"><label for="fMsg">Mensaje <span class="opt">(opcional)</span></label><textarea id="fMsg" maxlength="500" rows="3" placeholder="La tengo conmigo en casa. Está bien."></textarea></div>
      <div class="hp" aria-hidden="true"><label for="fWeb">No completar</label><input id="fWeb" tabindex="-1" autocomplete="off"></div>
      <p class="err-msg" id="fErr" role="alert" hidden></p>
      <button class="btn big wide" type="button" id="fSend">Avisar a su familia</button>
    </section>
    ${facts.length ? `<section class="sec"><h2>Para reconocer${ella === 'lo' ? 'lo' : 'la'}</h2><div class="facts">${facts.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div></section>` : ''}
    <p class="note">Esta ficha muestra solo lo necesario para que ${esc(p.name)} vuelva a casa. Cuando la abrís, su familia recibe un aviso con la hora y una zona aproximada según tu conexión (no es tu ubicación: esa la mandás solo si tocás el botón). Lo que mandes se guarda 90 días en el registro de su familia. <a href="/privacidad#mimitos">Privacidad</a>. Mimitos by Orbit.</p>`;
  wireFound();
}
/* "Avisale a su familia dónde estás": un toque pide la ubicación y la manda al instante.
   hereSt: '' (listo para tocar) · 'buscando' · 'enviando' · 'ok' · 'texto' (sin permiso: escribir dónde) · 'texto-ok' */
let hereSt = '';
function hereHtml() {
  const p = F, ella = p.sex === 'm' ? 'lo' : 'la';
  const label = p.lost ? `Si ${ella} encontraste, tocá acá: su familia ${ella} está buscando` : 'Avisale a su familia dónde estás';
  if (hereSt === 'ok') return `<div class="banner ok-b qr-here-ok">${bubble('check', 'salud')}<span><b>Listo: su familia ya sabe dónde estás</b>${here?.acc ? `Con una precisión de unos ${here.acc < 1000 ? here.acc + ' m' : Math.round(here.acc / 100) / 10 + ' km'}. ` : ''}Si podés, llamala o dejale tu teléfono abajo.</span></div>`;
  if (hereSt === 'texto-ok') return `<div class="banner ok-b qr-here-ok">${bubble('check', 'salud')}<span><b>Listo, ya le avisamos a su familia</b>Si podés, llamala o dejale tu teléfono abajo.</span></div>`;
  if (hereSt === 'texto') return `<div class="qr-here-txt"><p><b>No pudimos usar tu ubicación.</b> Escribí dónde estás y se lo mandamos.</p>
      <div class="f"><label for="hPlace">Dirección o referencia</label><input id="hPlace" maxlength="160" autocomplete="street-address" placeholder="Junín y 3 de Abril, frente a la plaza"></div>
      <p class="err-msg" id="hErr" role="alert" hidden></p>
      <button class="btn big wide" type="button" id="hSend">Mandar dónde estoy</button>
      <button class="link" type="button" id="hRetry">Probar de nuevo con la ubicación</button></div>`;
  const busy = hereSt === 'buscando' ? 'Buscando dónde estás…' : hereSt === 'enviando' ? 'Avisando a su familia…' : '';
  return `<button class="btn big wide qr-here-btn" type="button" id="hereBtn"${busy ? ' disabled aria-busy="true"' : ''}><span aria-hidden="true">📍</span> ${busy || label}</button>
    <small class="dim">Te pedimos la ubicación solo si tocás el botón, y le llega solo a su familia.</small>`;
}
function hereView(st) { hereSt = st; const box = document.getElementById('hereBox'); if (box) box.innerHTML = hereHtml(); wireFound(); if (st === 'texto') document.getElementById('hPlace')?.focus(); }
async function postFound(body) {
  const r = await fetch(`/api/mascotas?s=${token}&found=1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 429) throw new Error('limite');
  if (!r.ok) throw new Error('x');
}
const failMsg = e => e.message === 'limite' ? 'Ya se mandaron varios avisos desde esta conexión. Probá en un rato o usá los botones para llamar.' : 'No se pudo mandar. Revisá la conexión y probá de nuevo.';
const trap = () => (document.getElementById('fWeb')?.value || '').trim();
function wireFound() {
  const hb = document.getElementById('hereBtn'), hs = document.getElementById('hSend'), hr = document.getElementById('hRetry'), send = document.getElementById('fSend');
  if (hb) hb.onclick = () => {
    if (!navigator.geolocation) return hereView('texto');
    hereView('buscando');
    navigator.geolocation.getCurrentPosition(
      async pos => {
        here = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0) };
        hereView('enviando');
        try { await postFound({ loc: here, website: trap() }); hereView('ok'); }
        catch (e) { hereView(''); toast(failMsg(e)); }
      },
      err => { here = null; hereView('texto'); if (err.code !== 1) toast('No pudimos ubicarte. Escribí dónde estás.'); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  if (hr) hr.onclick = () => hereView('');
  if (hs) hs.onclick = async () => {
    const v = (document.getElementById('hPlace')?.value || '').trim(), err = document.getElementById('hErr');
    if (!v) { err.hidden = false; err.textContent = 'Escribí una dirección, una esquina o algo que ayude a ubicarte.'; return; }
    hs.disabled = true; hs.textContent = 'Avisando…';
    try { await postFound({ place: v, website: trap() }); hereView('texto-ok'); }
    catch (e) { hs.disabled = false; hs.textContent = 'Mandar dónde estoy'; err.hidden = false; err.textContent = failMsg(e); }
  };
  if (send) send.onclick = sendFound;
}
async function sendFound() {
  const v = id => (document.getElementById(id)?.value || '').trim();
  const body = { loc: here, name: v('fName'), phone: v('fPhone'), msg: v('fMsg'), website: v('fWeb') };
  const err = document.getElementById('fErr'), btn = document.getElementById('fSend');
  if (!body.name && !body.phone && !body.msg) { err.hidden = false; err.textContent = 'Dejá tu nombre, un teléfono o un mensaje.'; return; }
  err.hidden = true; btn.disabled = true; btn.textContent = 'Avisando…';
  try {
    const r = await fetch(`/api/mascotas?s=${token}&found=1`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 429) throw new Error('limite');
    if (!r.ok) throw new Error('x');
    document.getElementById('found').innerHTML = `<div class="qr-done">${bubble('check', 'salud')}<h2>¡Gracias! Ya le avisamos a su familia</h2><p class="dim">${body.phone ? 'Si pueden, te van a llamar o escribir al número que dejaste.' : 'Si no dejaste un teléfono, usá los botones de arriba para hablar con su familia.'}</p></div>`;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Avisar a su familia';
    err.hidden = false; err.textContent = failMsg(e);
  }
}

/* quien la cuida */
let P = null;
const KIND = { comida: ['Comió', 'bowl', 'comida'], paseo: ['Salió a pasear', 'walk', 'viaje'], med: ['Remedio', 'pill', 'med'], ok: ['Todo bien', 'check', 'salud'], nota: ['Nota', 'note', 'plata'], otro: ['Listo', 'drop', 'plata'] };
function me() { try { return localStorage.getItem('mz_by') || ''; } catch { return ''; } }
function setMe(v) { try { localStorage.setItem('mz_by', v); } catch {} }
let UNTIL = '', HOYD = null;
function cuidador(raw, until, hoy) {
  UNTIL = until || UNTIL; HOYD = hoy || HOYD;
  /* docs viejos o a medio cargar: sin sitter, sin remedios, sin contacto o sin veterinaria */
  const p = { ...raw, name: raw?.name || 'la mascota', sitter: raw?.sitter || {}, meds: Array.isArray(raw?.meds) ? raw.meds : [], log: Array.isArray(raw?.log) ? raw.log.filter(l => l && l.at) : [], contact: raw?.contact || {}, vet: raw?.vet || {} };
  P = p; document.getElementById('kindTag').textContent = 'Cuidando a ' + p.name;
  document.title = `Cuidando a ${p.name}`;
  /* "Gracias por cuidarla/cuidarlo"; si no sabemos el sexo, neutro */
  const gracias = p.sex === 'm' ? 'Gracias por cuidarlo' : p.sex === 'h' ? 'Gracias por cuidarla' : 'Gracias por cuidar a';
  const s = p.sitter, meds = p.meds.map(m => ({ m, st: Z.medState(m, p.log) })).filter(x => !['ended', 'nostart'].includes(x.st.state));
  const info = [['Comida', s.food, 'bowl', 'comida'], ['Paseos', s.walks, 'walk', 'viaje'], ['Dónde está cada cosa', s.where, 'search', 'plata'], ['Mañas y miedos', s.habits || p.temper, 'paw', 'cuida'], ['Llave de respaldo', s.key, 'home', 'salud'], ['Si pasa algo', s.emergency, 'alert', 'perdida']].filter(x => x[1]);
  const medName = id => p.meds.find(m => m.id === id)?.name || 'Remedio';
  const range = s.from || s.to ? `Del ${s.from ? fmt(s.from, { day: 'numeric', month: 'short' }) : '…'} al ${s.to ? fmt(s.to, { day: 'numeric', month: 'short' }) : '…'}` : '';
  app.innerHTML = `
    <section class="hero c-${Z.tone({ id: token })}"><div class="hero-top">${av(p)}<div><p class="hello">${range ? range + '. ' : ''}${gracias}</p><h1>${esc(p.name)}</h1></div></div>
      ${p.allergies ? `<div class="pills"><span class="pill warn">Alergia: ${esc(p.allergies)}</span></div>` : ''}</section>
    <div class="f"><label for="by">Tu nombre</label><input id="by" maxlength="40" value="${esc(me() || s.name || '')}" placeholder="Así la familia sabe quién anotó"></div>
    ${HOYD ? window.MZHOYUI.html(HOYD, p.name) : `<section class="sec"><h2>¿Cómo va el día?</h2>
      <div class="two"><button class="btn blue" data-k="comida">${I('bowl')} Comió</button><button class="btn blue" data-k="paseo">${I('walk')} Paseó</button></div></section>`}
    <section class="sec"><h2>¿Algo más?</h2>
      <div class="two"><button class="btn ghost" data-k="ok">${I('check')} Todo bien</button><button class="btn ghost" data-k="nota">${I('note')} Una nota</button></div>
    </section>
    ${meds.length ? `<section class="sec"><h2>Remedios</h2><div class="list">${meds.map(({ m, st }) => {
      const tx = { soon: ['st-ok', `Empieza ${Z.fmtWhen(st.next)}`], ok: ['st-done', st.next ? `Dada. Próxima: ${Z.fmtWhen(st.next)}` : 'Dada'], due: ['st-soon', `Le toca ahora (${Z.fmtTime(st.due)})`], late: ['st-late', `Atrasada: tocaba ${Z.fmtWhen(st.due)}`] }[st.state];
      /* con "Hoy" la lista del día manda: acá queda solo la indicación, sin estado (así no se contradicen) */
      if (HOYD) return `<div class="row">${bubble('pill', 'med')}<span class="what"><b>${esc(m.name)}</b><small>${m.dose ? esc(m.dose) + ' · ' : ''}cada ${m.every} h${m.notes ? '. ' + esc(m.notes) : ''}</small></span><span></span></div>`;
      return `<div class="row ${tx[0]}">${bubble('pill', 'med')}<span class="what"><b>${esc(m.name)}</b><small>${m.dose ? esc(m.dose) + ' · ' : ''}<span class="stt">${tx[1]}</span>${m.notes ? '. ' + esc(m.notes) : ''}</small></span>${!HOYD && (st.state === 'due' || st.state === 'late') ? `<button class="ibtn go" data-med="${m.id}">Ya se la di</button>` : '<span></span>'}</div>`; }).join('')}</div>${HOYD ? '<p class="note">Marcá cada toma en "Hoy", arriba.</p>' : ''}</section>` : ''}
    ${info.length ? `<section class="sec"><h2>Lo que tenés que saber</h2><div class="list">${info.map(([k, v, ic, c]) => `<div class="row" style="grid-template-columns:auto minmax(0,1fr);align-items:start">${bubble(ic, c)}<span class="what"><b>${k}</b><small style="color:var(--ink);font-size:15px;white-space:pre-wrap">${esc(v)}</small></span></div>`).join('')}</div>${s.vetAuth ? '<p class="note">La veterinaria está avisada: podés llevarla en nombre de la familia.</p>' : ''}</section>` : ''}
    <section class="sec"><h2>Contactos</h2><div class="list">
      ${p.contact.phone ? `<div class="row">${bubble('hand', 'cuida')}<span class="what"><b>${esc(p.contact.name || 'Familia')}</b><small>${esc(s.contact || p.contact.phone)}</small></span><a class="ibtn go" href="https://wa.me/${esc(wa(p.contact.phone))}" target="_blank" rel="noopener">WhatsApp</a></div>` : s.contact ? `<div class="row">${bubble('hand', 'cuida')}<span class="what"><b>${esc(s.contact)}</b></span><span></span></div>` : ''}
      ${p.vet.name ? `<div class="row">${bubble('heart', 'salud')}<span class="what"><b>${esc(p.vet.name)}</b><small>${esc(p.vet.address || 'Su veterinaria')}</small></span>${p.vet.phone ? `<a class="ibtn go" href="tel:${esc(tel(p.vet.phone))}" aria-label="Llamar">${I('phone')}</a>` : '<span></span>'}</div>` : ''}
      ${p.vet.er ? `<div class="row">${bubble('alert', 'perdida')}<span class="what"><b>${esc(p.vet.er)}</b><small>Guardia 24 horas</small></span>${p.vet.erPhone ? `<a class="ibtn go" href="tel:${esc(tel(p.vet.erPhone))}" aria-label="Llamar">${I('phone')}</a>` : '<span></span>'}</div>` : ''}
    </div></section>
    <section class="sec"><h2>Lo anotado</h2>${p.log.length ? `<div class="list">${[...p.log].reverse().slice(0, 15).map(l => { const k = KIND[l.kind] || KIND.nota; return `<div class="row">${bubble(k[1], k[2])}<span class="what"><b>${l.kind === 'med' ? esc(medName(l.medId)) : l.kind === 'nota' ? esc(l.note) : k[0]}</b><small>${esc(l.by)}</small></span><span class="when">${Z.fmtWhen(new Date(l.at))}</span></div>`; }).join('')}</div>` : '<p class="dim">Todavía no hay nada anotado.</p>'}</section>
    <p class="note">La familia de ${esc(p.name)} ve lo que anotás.${UNTIL ? ` Este link anda hasta el ${esc(fmt(UNTIL, { day: 'numeric', month: 'long' }))}.` : ''} Mimitos.</p>`;
}
async function post(body) {
  const by = (document.getElementById('by')?.value || '').trim(); setMe(by);
  try {
    const r = await fetch(`/api/mascotas?c=${token}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, by }) });
    const d = await r.json().catch(() => null);
    if (r.status === 404) return d?.expired || /venc|expir/i.test(d?.error || '') ? expired() : notFound();
    if (!r.ok || !d?.pet) throw 0;
    cuidador(d.pet, d.until || UNTIL, d.hoy); toast('Anotado. La familia ya lo ve.');
  } catch { toast('No se pudo anotar. Revisá la conexión y probá de nuevo.'); }
}
app.addEventListener('click', e => {
  const k = e.target.closest('[data-k]'), m = e.target.closest('[data-med]');
  if (k) {
    if (k.dataset.k === 'nota') {
      const box = document.createElement('div'); box.className = 'f';
      box.innerHTML = '<label for="nota">Nota para la familia</label><textarea id="nota" maxlength="300" placeholder="Comió poco, durmió bien…"></textarea><button class="btn blue" id="sendNota">Enviar nota</button>';
      k.closest('.sec').appendChild(box); document.getElementById('nota').focus();
      document.getElementById('sendNota').onclick = () => { const t = document.getElementById('nota').value.trim(); if (!t) return toast('Escribí la nota.'); post({ kind: 'nota', note: t }); };
      k.disabled = true; return;
    }
    return post({ kind: k.dataset.k });
  }
  if (m) post({ kind: 'med', medId: m.dataset.med });
});
/* "Hoy con…": un toque marca con la hora y tu nombre; si ya estaba hecho, el servidor avisa y se confirma */
window.MZHOYUI.attach(app, {
  ymd: () => HOYD?.ymd || '',
  getBy() {
    const el = document.getElementById('by'), v = (el?.value || '').trim();
    if (!v) { toast('Poné tu nombre arriba: así la familia sabe quién lo hizo.'); el?.focus(); return null; }
    setMe(v); return v;
  },
  async send(body) {
    const r = await fetch(`/api/mascotas?c=${token}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hoy: 1, ...body }) });
    return { status: r.status, data: await r.json().catch(() => null) };
  },
  onUpdate(d) {
    if (d?.expired) return expired();
    if (d?.pet) cuidador(d.pet, d.until || UNTIL, d.hoy);
  },
  toast,
});
load();
})();
</script>
