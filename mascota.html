<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha de mascota · Mimitos</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF2E7">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,0..100&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/mascotas.css?v=8">
</head>
<body>
<header class="top">
  <a class="brand mimi" href="/mascotas" aria-label="Mimitos"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27.5c-6.3-4.2-11-8.3-11-13.4C5 10.6 7.7 8 10.9 8c2.2 0 4 1.1 5.1 2.9C17.1 9.1 18.9 8 21.1 8 24.3 8 27 10.6 27 14.1c0 5.1-4.7 9.2-11 13.4z" fill="#E2734A"/><circle cx="12" cy="16" r="1.6" fill="#2B2119"/><circle cx="20" cy="16" r="1.6" fill="#2B2119"/><path d="M14 19.6c1.1.9 2.9.9 4 0" fill="none" stroke="#2B2119" stroke-width="1.5" stroke-linecap="round"/></svg><b>mimitos</b></a>
  <span class="sp"></span>
  <span class="tag" id="kindTag"></span>
</header>
<main id="app"><p class="dim">Cargando…</p></main>
<footer class="made">hecho con <a href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74.6 80.5A39 39 0 1 1 89 50" fill="none" stroke="#2B2119" stroke-width="22"/><circle cx="75" cy="80" r="12.5" fill="#3047FF"/></svg>Orbit</a></footer>
<div class="toast" id="toast" role="status"></div>
<script src="/assets/js/mascotas-core.js?v=8"></script>
<script>
(() => {
'use strict';
const Z = window.MZ, { esc, fmt, TYPE } = Z, app = document.getElementById('app');
const parts = location.pathname.split('/').filter(Boolean);
const kind = parts[0] === 'cuida' ? 'c' : 's', token = (parts[1] || new URLSearchParams(location.search).get(kind) || '').replace(/[^A-Za-z0-9_-]/g, '');
const tel = s => String(s || '').replace(/[^\d+]/g, '');
const wa = s => tel(s).replace(/^\+/, '');
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
const photo = p => p.photo ? `<img class="hero-photo" src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">` : '';
const notFound = () => { app.innerHTML = '<div class="empty"><h2>Este link ya no está activo</h2><p>Puede que la persona lo haya apagado. Pedile uno nuevo.</p></div>'; };

async function load() {
  if (!token) return notFound();
  try {
    const r = await fetch(`/api/mascotas?${kind}=${token}`);
    if (!r.ok) return notFound();
    const d = await r.json();
    kind === 's' ? ficha(d.pet, d.updatedAt) : cuidador(d.pet);
  } catch { app.innerHTML = '<div class="empty"><h2>No pudimos cargar la ficha</h2><p>Revisá tu conexión y recargá la página.</p></div>'; }
}

/* ficha pública: veterinario, paseador o quien la encuentre */
const I = Z.icon, bubble = (ic, c) => `<span class="ib c-${c}">${I(ic)}</span>`;
const av = p => `<div class="av big">${p.photo ? `<img src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">` : Z.petIcon(p)}</div>`;
function ficha(p, updatedAt) {
  document.title = `${p.name} · Ficha`;
  const facts = [['Raza', p.breed], ['Sexo', p.sex === 'h' ? 'Hembra' : p.sex === 'm' ? 'Macho' : ''], ['Edad', Z.age(p.birth)], ['Peso', p.weight ? String(p.weight).replace('.', ',') + ' kg' : ''], ['Color', p.color], ['Señas', p.marks], ['Microchip', p.chip]].filter(f => f[1]);
  const ups = Z.upcoming(p), c = p.contact, tone = Z.tone({ id: token });
  const callBtns = (msg, cls) => c?.phone ? `<div class="two"><a class="btn ${cls}" href="tel:${esc(tel(c.phone))}">${I('phone')} Llamar</a><a class="btn ghost" href="https://wa.me/${esc(wa(c.phone))}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a></div>` : '';
  app.innerHTML = `
    ${p.lost ? `<section class="banner lost" style="flex-direction:column;align-items:stretch"><h1 style="font-size:40px">Estoy perdida</h1><p>${p.lost.since ? 'Desde ' + Z.fmtWhen(new Date(p.lost.since)) : ''}${p.lost.place ? ', ' + esc(p.lost.place) : ''}.${p.lost.note ? ' ' + esc(p.lost.note) : ''}</p><p><b>Si me ves, no me persigas.</b> Avisale a mi familia:</p>${callBtns(`Hola, vi a ${p.name}.`, '')}</section>` : ''}
    <section class="hero c-${tone}"><div class="hero-top">${av(p)}<div><h1>${esc(p.name)}</h1></div></div>
      <div class="pills"><span class="pill">${esc(Z.species(p))}</span>${p.temper ? `<span class="pill">${esc(p.temper)}</span>` : ''}${p.allergies ? `<span class="pill warn">Alergia: ${esc(p.allergies)}</span>` : ''}</div></section>
    ${!p.lost && c?.phone ? `<section class="card"><div style="display:flex;gap:12px;align-items:center">${bubble('hand', 'cuida')}<span><b>¿Me encontraste?</b><span class="dim" style="display:block">Avisale a ${esc(c.name || 'mi familia')}${c.note ? '. ' + esc(c.note) : ''}</span></span></div>${callBtns(`Hola, encontré a ${p.name}.`, 'blue')}</section>` : ''}
    ${facts.length ? `<div class="facts">${facts.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
    ${(p.conditions || []).length || (p.surgeries || []).length || p.neutered ? `<section class="sec"><h2>Antecedentes</h2><div class="list">${p.neutered ? `<div class="row" style="grid-template-columns:auto minmax(0,1fr)">${bubble('heart', 'salud')}<span class="what"><b>${p.neutered === 'si' ? 'Castración: sí' : 'Sin castrar'}</b></span></div>` : ''}${(p.conditions || []).map(c => `<div class="row" style="grid-template-columns:auto minmax(0,1fr)">${bubble('heart', 'perdida')}<span class="what"><b>${esc(c.name)}</b><small>${c.status === 'controlada' ? 'Controlado' : 'Lo tiene'}</small></span></div>`).join('')}${(p.surgeries || []).map(c => `<div class="row" style="grid-template-columns:auto minmax(0,1fr)">${bubble('scalpel', 'perdida')}<span class="what"><b>${esc(c.name)}</b><small>Cirugía${c.date ? ', ' + fmt(c.date) : ''}</small></span></div>`).join('')}</div></section>` : ''}
    <section class="sec"><h2>Vacunas y controles</h2>
      ${p.records.length ? `<div class="list">${[...p.records].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(r => { const u = ups.find(x => x.r.name === r.name && x.r.type === r.type && x.r.date === r.date); return `<div class="row ${u ? u.s.c : ''}" style="grid-template-columns:auto minmax(0,1fr)">${bubble(Z.recIcon(r.type), r.type === 'control' ? 'cuida' : 'salud')}<span class="what"><b>${esc(r.name)}</b><small>${TYPE[r.type]}${r.date ? ', ' + fmt(r.date) : ''}${r.vet ? ', ' + esc(r.vet) : ''}</small>${u ? `<small class="stt">${u.s.days < 0 ? 'Vencida el ' + fmt(r.next) : 'Vigente hasta el ' + fmt(r.next)}</small>` : ''}</span></div>`; }).join('')}</div>` : '<p class="dim">Sin registros cargados.</p>'}
    </section>
    ${p.vet ? `<div class="row">${bubble('heart', 'salud')}<span class="what"><b>${esc(p.vet.name || 'Su veterinaria')}</b><small>Su veterinaria</small></span>${p.vet.phone ? `<a class="ibtn go" href="tel:${esc(tel(p.vet.phone))}" aria-label="Llamar a la veterinaria">${I('phone')}</a>` : '<span></span>'}</div>` : ''}
    <p class="note">${updatedAt ? 'Actualizado el ' + fmt(updatedAt.slice(0, 10)) + '. ' : ''}Datos cargados por su familia en Mimitos.</p>`;
}

/* quien la cuida */
let P = null;
const KIND = { comida: ['Comió', 'bowl', 'comida'], paseo: ['Salió a pasear', 'walk', 'viaje'], med: ['Remedio', 'pill', 'med'], ok: ['Todo bien', 'check', 'salud'], nota: ['Nota', 'note', 'plata'] };
function me() { try { return localStorage.getItem('mz_by') || ''; } catch { return ''; } }
function setMe(v) { try { localStorage.setItem('mz_by', v); } catch {} }
function cuidador(p) {
  P = p; document.getElementById('kindTag').textContent = 'Cuidando a ' + p.name;
  document.title = `Cuidando a ${p.name}`;
  const s = p.sitter, meds = p.meds.map(m => ({ m, st: Z.medState(m, p.log) })).filter(x => !['ended', 'nostart'].includes(x.st.state));
  const info = [['Comida', s.food, 'bowl', 'comida'], ['Paseos', s.walks, 'walk', 'viaje'], ['Dónde está cada cosa', s.where, 'search', 'plata'], ['Mañas y miedos', s.habits || p.temper, 'paw', 'cuida'], ['Llave de respaldo', s.key, 'home', 'salud'], ['Si pasa algo', s.emergency, 'alert', 'perdida']].filter(x => x[1]);
  const medName = id => p.meds.find(m => m.id === id)?.name || 'Remedio';
  const range = s.from || s.to ? `Del ${s.from ? fmt(s.from, { day: 'numeric', month: 'short' }) : '…'} al ${s.to ? fmt(s.to, { day: 'numeric', month: 'short' }) : '…'}` : '';
  app.innerHTML = `
    <section class="hero c-${Z.tone({ id: token })}"><div class="hero-top">${av(p)}<div><p class="hello">${range ? range + '. ' : ''}Gracias por cuidarla</p><h1>${esc(p.name)}</h1></div></div>
      ${p.allergies ? `<div class="pills"><span class="pill warn">Alergia: ${esc(p.allergies)}</span></div>` : ''}</section>
    <div class="f"><label for="by">Tu nombre</label><input id="by" maxlength="40" value="${esc(me() || s.name || '')}" placeholder="Así la familia sabe quién anotó"></div>
    <section class="sec"><h2>¿Cómo va el día?</h2>
      <div class="two"><button class="btn blue" data-k="comida">${I('bowl')} Comió</button><button class="btn blue" data-k="paseo">${I('walk')} Paseó</button><button class="btn ghost" data-k="ok">${I('check')} Todo bien</button><button class="btn ghost" data-k="nota">${I('note')} Una nota</button></div>
    </section>
    ${meds.length ? `<section class="sec"><h2>Remedios</h2><div class="list">${meds.map(({ m, st }) => {
      const tx = { soon: ['st-ok', `Empieza ${Z.fmtWhen(st.next)}`], ok: ['st-done', st.next ? `Dada. Próxima: ${Z.fmtWhen(st.next)}` : 'Dada'], due: ['st-soon', `Le toca ahora (${Z.fmtTime(st.due)})`], late: ['st-late', `Atrasada: tocaba ${Z.fmtWhen(st.due)}`] }[st.state];
      return `<div class="row ${tx[0]}">${bubble('pill', 'med')}<span class="what"><b>${esc(m.name)}</b><small>${m.dose ? esc(m.dose) + ' · ' : ''}<span class="stt">${tx[1]}</span>${m.notes ? '. ' + esc(m.notes) : ''}</small></span>${st.state === 'due' || st.state === 'late' ? `<button class="ibtn go" data-med="${m.id}">Ya se la di</button>` : '<span></span>'}</div>`; }).join('')}</div></section>` : ''}
    ${info.length ? `<section class="sec"><h2>Lo que tenés que saber</h2><div class="list">${info.map(([k, v, ic, c]) => `<div class="row" style="grid-template-columns:auto minmax(0,1fr);align-items:start">${bubble(ic, c)}<span class="what"><b>${k}</b><small style="color:var(--ink);font-size:15px;white-space:pre-wrap">${esc(v)}</small></span></div>`).join('')}</div>${s.vetAuth ? '<p class="note">La veterinaria está avisada: podés llevarla en nombre de la familia.</p>' : ''}</section>` : ''}
    <section class="sec"><h2>Contactos</h2><div class="list">
      ${p.contact.phone ? `<div class="row">${bubble('hand', 'cuida')}<span class="what"><b>${esc(p.contact.name || 'Familia')}</b><small>${esc(s.contact || p.contact.phone)}</small></span><a class="ibtn go" href="https://wa.me/${esc(wa(p.contact.phone))}" target="_blank" rel="noopener">WhatsApp</a></div>` : s.contact ? `<div class="row">${bubble('hand', 'cuida')}<span class="what"><b>${esc(s.contact)}</b></span><span></span></div>` : ''}
      ${p.vet.name ? `<div class="row">${bubble('heart', 'salud')}<span class="what"><b>${esc(p.vet.name)}</b><small>${esc(p.vet.address || 'Su veterinaria')}</small></span>${p.vet.phone ? `<a class="ibtn go" href="tel:${esc(tel(p.vet.phone))}" aria-label="Llamar">${I('phone')}</a>` : '<span></span>'}</div>` : ''}
      ${p.vet.er ? `<div class="row">${bubble('alert', 'perdida')}<span class="what"><b>${esc(p.vet.er)}</b><small>Guardia 24 horas</small></span>${p.vet.erPhone ? `<a class="ibtn go" href="tel:${esc(tel(p.vet.erPhone))}" aria-label="Llamar">${I('phone')}</a>` : '<span></span>'}</div>` : ''}
    </div></section>
    <section class="sec"><h2>Lo anotado</h2>${p.log.length ? `<div class="list">${[...p.log].reverse().slice(0, 15).map(l => { const k = KIND[l.kind]; return `<div class="row">${bubble(k[1], k[2])}<span class="what"><b>${l.kind === 'med' ? esc(medName(l.medId)) : l.kind === 'nota' ? esc(l.note) : k[0]}</b><small>${esc(l.by)}</small></span><span class="when">${Z.fmtWhen(new Date(l.at))}</span></div>`; }).join('')}</div>` : '<p class="dim">Todavía no hay nada anotado.</p>'}</section>
    <p class="note">La familia de ${esc(p.name)} ve lo que anotás. Mimitos.</p>`;
}
async function post(body) {
  const by = (document.getElementById('by')?.value || '').trim(); setMe(by);
  try {
    const r = await fetch(`/api/mascotas?c=${token}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, by }) });
    const d = await r.json(); if (!r.ok) throw 0;
    cuidador(d.pet); toast('Anotado. La familia ya lo ve.');
  } catch { toast('No se pudo anotar. Revisá la conexión y probá de nuevo.'); }
}
app.addEventListener('click', e => {
  const k = e.target.closest('[data-k]'), m = e.target.closest('[data-med]');
  if (k) {
    if (k.dataset.k === 'nota') {
      const box = document.createElement('div'); box.className = 'f';
      box.innerHTML = '<label for="nota">Nota para la familia</label><textarea id="nota" maxlength="300" placeholder="Comió poco, durmió bien…"></textarea><button class="btn blue" id="sendNota">Enviar nota</button>';
      k.closest('.sec').appendChild(box); document.getElementById('nota').focus();
      document.getElementById('sendNota').onclick = () => { const t = document.getElementById('nota').value.trim(); if (!t) return toast('Escribí la nota.'); post({ kind: 'nota', note: t }); };
      k.disabled = true; return;
    }
    return post({ kind: k.dataset.k });
  }
  if (m) post({ kind: 'med', medId: m.dataset.med });
});
load();
})();
</script>
</body>
</html>
