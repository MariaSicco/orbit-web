<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar a Mimitos — By Majo Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#37261e">
<link rel="icon" href="/assets/img/mimitos/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:#fffeef;color:#37261e;font:500 16px/1.45 "Bricolage Grotesque",Helvetica,Arial,sans-serif}
.sala{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.foto{position:relative;margin:0;background:#37261e;padding:28px 28px 0;display:flex;flex-direction:column;align-items:center}
.foto .logo{height:72px;width:auto;filter:brightness(0) invert(1);margin-bottom:22px}
.foto .arco{flex:1;width:100%;max-width:520px;min-height:0;overflow:hidden;border-radius:280px 280px 0 0}
.foto .arco img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.caja{width:100%;max-width:420px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffdae3;font-size:13px;font-weight:800}
h1{margin:14px 0 10px;font-size:clamp(44px,6vw,68px);line-height:.95;font-weight:800;letter-spacing:-.04em}
h1 mark{background:#f3b6c8;color:inherit;padding:0 10px;border-radius:10px}
p{margin:0 0 20px}
label{display:block;margin:0 0 6px;font-size:14px;font-weight:800}
input{width:100%;padding:15px 16px;border:1.5px solid rgba(55,38,30,.3);border-radius:14px;background:#fff;color:inherit;font:inherit;margin-bottom:14px}
input:focus-visible,button:focus-visible{outline:3px solid #6b1f30;outline-offset:2px}
button{cursor:pointer;font:inherit}
.btn{display:block;width:100%;padding:17px 20px;border:0;border-radius:99px;background:#6b1f30;color:#fffeef;font-size:17px;font-weight:800}
.btn:disabled{opacity:.6;cursor:wait}
.alt{display:block;margin:16px auto 0;padding:8px;border:0;background:none;color:inherit;text-decoration:underline;font-size:14px}
.msj{min-height:24px;margin:14px 0 0;font-weight:800}.msj.mal{color:#a12a2a}
.pie{margin:26px 0 0;font-size:13px;opacity:.75}.pie a{color:inherit}
[hidden]{display:none!important}
@media(max-width:760px){.sala{grid-template-columns:1fr;min-height:0}.foto{padding:20px 20px 0}.foto .logo{height:58px;margin-bottom:14px}.foto .arco{height:250px;flex:none;border-radius:160px 160px 0 0}.form{padding:28px 20px 40px}}
</style>
</head>
<body>
<main class="sala">
  <figure class="foto">
    <img class="logo" src="/assets/img/mimitos/bm-logo.png" alt="By Majo Studio">
    <div class="arco"><img src="/assets/img/mimitos/bm-sala.jpg" alt=""></div>
  </figure>
  <section class="form"><div class="caja">
    <span class="chip">Mimitos</span>
    <h1>Entrá a tu <mark>app</mark></h1>
    <p id="bajada">Poné el mail con el que compraste y te mando un enlace para entrar, sin contraseña.</p>
    <form id="f" novalidate>
      <label for="mail">Tu email</label>
      <input id="mail" type="email" autocomplete="email" inputmode="email" required>
      <div id="conClave" hidden>
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password">
      </div>
      <button class="btn" id="ir" type="submit">Mandame el enlace</button>
    </form>
    <button class="alt" id="cambiar" type="button">Prefiero usar mi contraseña</button>
    <p class="msj" id="msj" role="status" aria-live="polite"></p>
    <p class="pie">¿No la tenés todavía? <a href="https://bymajostudio.com/tienda/mimitos">Conseguí Mimitos</a> · <a href="/privacidad">Privacidad</a> · <a href="/terminos">Términos</a></p>
  </div></section>
</main>
<script src="/assets/js/mimitos-acceso.js?v=1"></script>
</body>
</html>
