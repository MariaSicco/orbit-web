<!doctype html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producto — Orbit®</title>
<script>(function(){var d=document.documentElement,l=null,q=new URLSearchParams(location.search).get('lang');try{l=localStorage.getItem('orbit-lang')||sessionStorage.getItem('orbit-lang')}catch(e){}if(q==='es'||q==='en'){l=q;try{localStorage.setItem('orbit-lang',q)}catch(e){}}d.dataset.lang=l||((navigator.language||'es').slice(0,2)==='en'?'en':'es');d.lang=d.dataset.lang;if(!l)d.classList.add('gate-on')})()</script>
<meta name="description" content="Productos digitales Orbit. Ideas in motion.">
<meta name="theme-color" content="#0D0D0E">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/orbit.css?v=44">
<style>
.pd{padding-top:calc(100px + env(safe-area-inset-top,0px))}
.crumb{display:flex;gap:10px;margin-bottom:24px}
.crumb a{text-decoration:none;opacity:.6}.crumb a:hover{opacity:1}
.pd-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,64px);align-items:start}
.pd-info{position:sticky;top:calc(90px + env(safe-area-inset-top,0px))}
.pd-info h1{font-size:clamp(52px,6.6vw,110px);margin:14px 0 0}
.pd-price{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:26px 0 18px;padding-top:16px;border-top:1px solid var(--k3)}
.pd-price b{font-size:clamp(34px,3.4vw,52px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pd-buy{display:flex;flex-direction:column;gap:10px}
.pd-buy .btn{justify-content:center;padding:18px 20px;font-size:16px}
.pd-trust{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:22px}
.pd-trust>span{display:flex;gap:8px;align-items:center}
.pd-trust>span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.pd-gal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px)}
.pd-gal .boxstage{grid-column:1/-1}
.pd-gal .photo{aspect-ratio:3/4}
.pd-gal .tile{aspect-ratio:3/4;background:var(--b2);display:grid;place-items:center;padding:12%}
.specs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:rgba(13,13,14,.15)}
.specs>div{background:var(--b);padding:18px}
.specs b{display:block;font-size:clamp(18px,1.8vw,26px);letter-spacing:-.03em;margin-top:10px;line-height:1.1}
.inc{scroll-margin-top:110px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px);margin-top:clamp(36px,5vw,72px)}
.inc>div{border-top:2px solid var(--k);padding-top:16px;display:grid;grid-template-columns:48px 1fr;gap:14px}
.inc h3{margin:0;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.035em;font-weight:800;text-transform:uppercase;line-height:1}
.inc p{margin:8px 0 0;opacity:.7}
.for{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,64px)}
.for ul{list-style:none;margin:0;padding:0}
.for li{padding:18px 0;border-top:1px solid var(--k3);font-weight:700;font-size:clamp(22px,2.6vw,38px);letter-spacing:-.035em;line-height:1.05}
.for li:last-child{border-bottom:1px solid var(--k3)}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--k);color:var(--b);border-top:1px solid var(--k3);padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:16px;transform:translateY(110%);transition:transform .45s var(--ease)}
.buybar.on{transform:none}
.buybar .btn{padding:12px 16px}
@media (max-width:960px){.pd-grid,.for{grid-template-columns:1fr}.pd-info{position:static}.specs{grid-template-columns:1fr 1fr}.inc{grid-template-columns:1fr}}
</style>
</head>
<body data-page="productos">
<main>
<section class="sec dark pd">
  <div class="wrap">
    <nav class="crumb mono" aria-label="Breadcrumb"><a href="productos.html"><span data-l="es">Productos</span><span data-l="en">Products</span></a><span class="dim">/</span><span id="crumbCode"></span></nav>
    <div class="pd-grid">
      <div class="pd-gal" id="gal"></div>
      <div class="pd-info" id="info"></div>
    </div>
  </div>
</section>

<section class="sec light">
  <div class="wrap">
    <div class="shead mono"><div><b><span data-l="es">Especificaciones</span><span data-l="en">Specs</span></b><span id="specCode"></span></div><div style="text-align:right"><span data-l="es">Qué es, en datos</span><span data-l="en">What it is, in data</span></div></div>
    <div class="specs rv" id="specs"></div>
    <div class="inc" id="inc"></div>
  </div>
</section>

<section class="sec dark">
  <div class="wrap for">
    <div class="rv"><span class="mono"><span data-l="es">Para quién</span><span data-l="en">Who it’s for</span></span><h2 class="display" style="margin-top:14px;font-size:clamp(44px,5.4vw,90px)"><span data-l="es">Hecho para quienes <span class="it">hacen.</span></span><span data-l="en">Made for people who <span class="it">make.</span></span></h2></div>
    <ul class="rv" id="for"></ul>
  </div>
</section>

<section class="sec light">
  <div class="wrap">
    <div class="shead mono"><div><b><span data-l="es">Seguí explorando</span><span data-l="en">Keep exploring</span></b><span data-l="es">Otros productos</span><span data-l="en">Other products</span></div><div style="text-align:right"><a href="productos.html"><span data-l="es">Catálogo completo →</span><span data-l="en">Full catalog →</span></a></div></div>
    <div class="pgrid" id="rel"></div>
  </div>
</section>
</main>
<div class="buybar" id="buybar" aria-hidden="true"></div>
<script src="assets/js/products.js?v=44"></script>
<script src="/api/catalog"></script>
<script src="assets/js/orbit.js?v=44"></script>
<script>
(() => {
const {C, $, L, tr, sym, card, buyBtn, mountBox, reveal, P, FAM, ACC, money} = ORBIT;
const id = window.ORBIT_ID || new URLSearchParams(location.search).get('id')
  || (location.pathname.match(/\/p\/([\w-]+)/) || [])[1];
const p = P.find(x => x.id === id) || P[0];
const [fam] = FAM[p.family] || [''];
const acc = ACC[p.accent] || C.blue;
document.body.dataset.titleEs = document.body.dataset.titleEn = `${p.code} ${p.name} — Orbit®`;
document.title = `${p.code} ${p.name} — Orbit®`;
const setDesc = () => $('meta[name="description"]').setAttribute('content', tr(p.tagline));
setDesc(); addEventListener('orbit:lang', setDesc);
$('#crumbCode').textContent = `${p.code} ${p.name}`;
$('#specCode').textContent = p.code;

$('#gal').innerHTML = `<div class="boxstage" id="bx"></div>
  <div class="photo" style="background-image:url(assets/img/${p.photo}.jpg)" role="img" aria-label="${p.name}"></div>
  <div class="tile">${sym({ring:C.k, dot:acc === C.k ? C.blue : acc})}</div>`;
mountBox($('#bx'), p);

const [w1, ...rest] = p.name.split(' ');
const TRUST = [['Descarga inmediata','Instant download'],['Uso comercial','Commercial use'],['Actualizaciones sin cargo','Free updates'],['Soporte por email','Email support']];
$('#info').innerHTML = `<span class="mono">${p.code} · ${fam}</span>
  <h1 class="display">${w1}<br><span class="it">${rest.join(' ').toLowerCase()}.</span></h1>
  <p class="lead" style="opacity:.8;margin:22px 0 0">${L(p.tagline)}</p>
  <div class="pd-price"><b>${p.status==='soon' ? L('Pronto','Soon') : money(p.price)}</b><span class="mono dim">${p.status==='soon' ? L('Lanzamiento 2026','Launching 2026') : L('Pago único · impuestos según país','One-time payment · taxes by country')}</span></div>
  <div class="pd-buy">${buyBtn(p)}<a class="btn btn-line" href="#inc">${L('Qué incluye','What’s inside')}</a></div>
  <div class="pd-trust mono">${TRUST.map(([es,en]) => `<span>${L(es,en)}</span>`).join('')}</div>`;

$('#specs').innerHTML = p.specs.map(([k,v]) => `<div><span class="mono dim">${L(k)}</span><b>${L(v)}</b></div>`).join('');
$('#inc').innerHTML = p.includes.map(([t,d],i) => `<div class="rv"><div>${sym({ring:C.k, dot:i===0?acc:C.k, rot:i*90, gap:70})}</div><div><span class="mono dim">${L('Incluye','Includes')} 0${i+1}</span><h3 style="margin-top:8px">${L(t)}</h3><p>${L(d)}</p></div></div>`).join('');
$('#for').innerHTML = p.for.map(t => `<li>${L(t)}</li>`).join('');
$('#rel').innerHTML = P.filter(x => x.id !== p.id).map(card).join('');

const bar = $('#buybar'), info = $('#info');
bar.innerHTML = `<div><span class="mono dim">${p.code}</span><div style="font-weight:800;letter-spacing:-.03em;text-transform:uppercase">${p.name}</div></div>${buyBtn(p)}`;
new IntersectionObserver(([e]) => { const on = !e.isIntersecting && e.boundingClientRect.top < 0; bar.classList.toggle('on', on); bar.setAttribute('aria-hidden', String(!on)); }).observe($('.pd-buy', info));

reveal();
})();
</script>
</body>
</html>
