<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propuesta</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Familjen+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&family=Jost:wght@300..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/cot-web.css?v=3">
<style>
html,body{margin:0;background:#111}
.msg{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#9a958a;font-family:system-ui,sans-serif;background:#0B0B0D}
.msg b{display:block;color:#EEE9DF;font-size:22px;margin-bottom:6px}
.pv-flag{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:200;background:#D9FF45;color:#0D0D0E;font:600 12px system-ui,sans-serif;padding:8px 14px;border-radius:999px;letter-spacing:.02em}
</style>
</head>
<body>
<div id="app"><div class="msg"><div><b>…</b></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="/assets/js/cot-data.js?v=2"></script>
<script src="/assets/js/cot-render.js?v=2"></script>
<script src="/assets/js/cot-web.js?v=3"></script>
<script>
(async () => {
  const R = window.COTR, app = document.getElementById('app');
  const qs = new URLSearchParams(location.search);
  const preview = qs.has('preview');
  const id = qs.get('id') || (location.pathname.split('/').filter(Boolean)[1] || '');
  let P, accepted = null;
  if (preview) {
    try { P = JSON.parse(localStorage.getItem('orbit-cot2-preview') || 'null'); } catch (e) {}
    if (!P) { app.innerHTML = '<div class="msg"><div><b>No hay vista previa</b>Volvé al cotizador y tocá "Ver como la ve tu cliente".</div></div>'; return; }
  } else {
    try { const r = await fetch('/api/propuesta?id=' + encodeURIComponent(id)); if (!r.ok) throw 0; const d = await r.json(); P = d.p; accepted = d.accepted; }
    catch (e) { app.innerHTML = '<div class="msg"><div><b>No encontramos esta propuesta</b>Revisá el link o pedile uno nuevo a quien te la mandó.</div></div>'; return; }
  }
  document.documentElement.lang = P.lang || 'es';
  document.title = `${R.docTitle(P)} · ${P.proj || ''} · ${P.biz.name || ''}`;
  window.COTW.mount(app, P, {
    preview, accepted,
    onAccept: async ({ name, option, sig }) => {
      if (preview) return { name, option, sig, at: new Date().toISOString() };
      const r = await fetch('/api/propuesta?accept=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, name, option, sig }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'error');
      return d.accepted;
    },
  });
  if (preview) { const f = document.createElement('div'); f.className = 'pv-flag'; f.textContent = 'Vista previa · así la ve tu cliente'; document.body.appendChild(f); }
})();
</script>
</body>
</html>
