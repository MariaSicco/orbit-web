<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel — Orbit®</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0D0D0E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/orbit.css?v=43">
<style>
body{padding:0}
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px var(--pad);background:rgba(13,13,14,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--k3)}
.top .brand{display:flex;align-items:baseline;gap:12px}
.top .brand b{font-weight:900;letter-spacing:-.05em;font-size:24px;text-transform:uppercase}
.top .brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.top .who{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;opacity:.6}
.top .who a,.top .who button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--k3);padding:7px 12px;transition:background .2s,color .2s,border-color .2s}
.top .who a:hover,.top .who button:hover{background:var(--b);color:var(--k);border-color:var(--b)}

main{padding:clamp(28px,4vw,56px) var(--pad) clamp(60px,8vw,110px);max-width:1440px;margin-inline:auto}
h1{font-size:clamp(42px,6.4vw,104px)}
h1 .it{color:var(--or)}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:14px 0 0}

.rail{display:flex;gap:2px;background:var(--k3);margin:clamp(26px,3.4vw,44px) 0 0;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:1;min-width:150px;background:var(--k);padding:15px 16px;text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:relative;transition:background .22s}
.rail button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .34s var(--ease)}
.rail button:hover{background:var(--k2)}
.rail button[aria-pressed="true"]{background:var(--k2)}
.rail button[aria-pressed="true"]::after{transform:scaleX(1)}
.pane{padding-top:clamp(28px,3.6vw,52px)}

.bh{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:13px;border-bottom:1px solid var(--k3);margin-bottom:clamp(16px,2vw,26px);flex-wrap:wrap}
.bh h2{margin:0;font-weight:800;font-size:clamp(19px,2vw,28px);letter-spacing:-.035em;text-transform:uppercase;line-height:1}
.bh .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.45}
.blk{margin-bottom:clamp(38px,5vw,72px)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--k3)}
.kpis>div{background:var(--k2);padding:clamp(16px,1.8vw,24px);display:grid;gap:8px;align-content:start;min-height:122px}
.kpis .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.5}
.kpis b{font-size:clamp(28px,3.2vw,46px);font-weight:800;letter-spacing:-.045em;line-height:.92;font-variant-numeric:tabular-nums}
.kpis .u{font-size:12.5px;opacity:.5;line-height:1.35}
.kpis .acid b{color:var(--ac)}
.kpis .blue b{color:#6F80FF}
@media (max-width:1040px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.45;font-weight:400;padding:0 14px 11px 0;border-bottom:1px solid var(--k3)}
td{padding:13px 14px 13px 0;border-bottom:1px solid var(--k3);vertical-align:top}
td.num,th.num{text-align:right;padding-right:0;font-variant-numeric:tabular-nums;white-space:nowrap}
td .mono{opacity:.55}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px}
.tag-ok{background:var(--ac);color:var(--k)}
.tag-pend{background:var(--or);color:var(--k)}
.tag-soft{border:1px solid var(--k3);opacity:.7}
.scroll{overflow-x:auto}

.prod{background:var(--k2);padding:clamp(18px,2.2vw,28px);margin-bottom:2px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.prod .head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.prod .head b{font-weight:800;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.035em;text-transform:uppercase;line-height:1}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:15px;padding:12px 13px;background:var(--k);border:1px solid var(--k3);color:var(--b);transition:border-color .2s}
.fld textarea{resize:vertical;min-height:62px;line-height:1.45;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue)}
.fld .tip{font-size:11.5px;opacity:.4;line-height:1.4}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pmsg{font-size:13px;min-height:1.2em;color:var(--or)}
.pmsg.ok{color:var(--ac)}
.btn.sm{padding:12px 18px;font-size:14px}
.drop{border:1px dashed var(--k3);background:var(--k);padding:18px;display:grid;gap:5px;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--ac);background:#121213}
.drop b{font-weight:700;font-size:15px;letter-spacing:-.02em}
.drop .tip{font-size:12px;opacity:.45;line-height:1.4}
.prog{height:3px;background:var(--k3);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .18s linear}
.fstate{font-size:12px;opacity:.55;line-height:1.45}
.fstate.ok{color:var(--ac);opacity:1}
.fstate.err{color:var(--or);opacity:1}
.alt-url{font-size:12px;opacity:.5;cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.alt-url:hover{opacity:1;color:var(--ac)}

.gate{min-height:70svh;display:grid;place-items:center;text-align:center}
.gate .box{max-width:560px;display:grid;gap:16px;justify-items:center}
.gate h2{margin:0;font-weight:800;font-size:clamp(28px,4vw,52px);letter-spacing:-.04em;text-transform:uppercase;line-height:1}
.gate p{margin:0;opacity:.65;line-height:1.55}
.gate code{font-family:var(--mono);font-size:12.5px;background:var(--k2);border:1px solid var(--k3);padding:10px 14px;display:block;text-align:left;word-break:break-all}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Orbit</b><span>Administración</span></div>
  <div class="who"><span id="whoami"></span><a href="index.html">Ver sitio</a><button id="out">Salir</button></div>
</header>

<main>
  <div id="gate" class="gate hidden"><div class="box" id="gateBox"></div></div>

  <div id="app" class="hidden">
    <span class="mono dim">OB—000 · Interno</span>
    <h1 class="display">El <span class="it">tablero.</span></h1>
    <p class="sub" id="stamp"></p>

    <nav class="rail" id="rail">
      <button type="button" data-tab="res" aria-pressed="true">Resumen</button>
      <button type="button" data-tab="prod" aria-pressed="false">Productos</button>
      <button type="button" data-tab="gente" aria-pressed="false">Personas</button>
      <button type="button" data-tab="ped" aria-pressed="false">Pedidos</button>
    </nav>

    <section class="pane" data-pane="res">
      <div class="blk">
        <div class="bh"><h2>Personas</h2><span class="hint">Cuentas creadas en el sitio</span></div>
        <div class="kpis" id="kGente"></div>
      </div>
      <div class="blk">
        <div class="bh"><h2>Ventas</h2><span class="hint">Solo pedidos con el pago acreditado</span></div>
        <div class="kpis" id="kVentas"></div>
      </div>
      <div class="blk">
        <div class="bh"><h2>Por producto</h2><span class="hint">Unidades vendidas y facturación</span></div>
        <div class="scroll"><table id="tProd"></table></div>
      </div>
    </section>

    <section class="pane hidden" data-pane="prod">
      <div class="blk">
        <div class="bh"><h2>Productos</h2><span class="hint">Se guarda al instante, sin tocar código ni Vercel</span></div>
        <div id="prods"></div>
      </div>
    </section>

    <section class="pane hidden" data-pane="gente">
      <div class="blk">
        <div class="bh"><h2>Últimas cuentas</h2><span class="hint" id="gCount"></span></div>
        <div class="scroll"><table id="tGente"></table></div>
      </div>
    </section>

    <section class="pane hidden" data-pane="ped">
      <div class="blk">
        <div class="bh"><h2>Últimos pedidos</h2><span class="hint" id="pCount"></span></div>
        <div class="scroll"><table id="tPed"></table></div>
      </div>
    </section>
  </div>
</main>

<script>
(async () => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const ars = n => 'ARS ' + Number(n || 0).toLocaleString('es-AR');
const usd = n => 'USD ' + Number(n || 0).toLocaleString('es-AR');
const fecha = d => d ? new Date(d).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—';
const peso = b => !b ? '0 KB' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const hora = d => d ? new Date(d).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : '';

function gate(title, body, extra) {
  $('#app').classList.add('hidden');
  $('#gate').classList.remove('hidden');
  $('#gateBox').innerHTML = '<span class="mono dim">Panel</span><h2>' + title + '</h2><p>' + body + '</p>' + (extra || '');
}

/* ── datos ── */
let data = null;
const r = await fetch('/api/admin/report');
if (r.status === 401) { location.replace('acceso.html'); return; }
if (r.status === 403) { gate('Esta cuenta no es administradora', 'Entrá con el email que figura en <code>ADMIN_EMAILS</code>, o agregá este email a esa variable en Vercel.', '<a class="btn btn-line" href="biblioteca.html">Ir a mi cuenta</a>'); return; }
if (r.status === 503) {
  gate('Falta habilitar el panel',
    'En Vercel, agregá una variable de entorno llamada <b>ADMIN_EMAILS</b> con tu email (podés poner varios separados por coma) y volvé a desplegar.',
    '<code>ADMIN_EMAILS = tuemail@ejemplo.com</code>');
  return;
}
if (!r.ok) { gate('No pudimos cargar el informe', 'Probá de nuevo en un momento.'); return; }
data = await r.json();
$('#app').classList.remove('hidden');
$('#stamp').textContent = 'Actualizado ' + fecha(data.generado) + ' · ' + hora(data.generado);

/* ── quién soy ── */
try { const me = await (await fetch('/api/me')).json(); $('#whoami').textContent = me.email || ''; } catch (e) {}
$('#out').onclick = async () => { try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {} document.cookie = 'orbit_user=; Path=/; Max-Age=0; SameSite=Lax; Secure'; location.href = 'acceso.html?salir=1'; };

/* ── resumen ── */
const kpi = (k, big, u, cls) => '<div class="' + (cls || '') + '"><span class="k">' + k + '</span><b>' + big + '</b><span class="u">' + (u || '') + '</span></div>';
const g = data.gente, pe = data.pedidos, inn = data.ingresos;
$('#kGente').innerHTML = [
  kpi('Cuentas creadas', g.total, g.nuevos7 + ' en los últimos 7 días', 'acid'),
  kpi('Compraron alguna vez', g.compradores, g.total ? Math.round(g.compradores / g.total * 100) + '% de las cuentas' : 'Sin cuentas todavía'),
  kpi('Suscriptas a novedades', g.novedades, 'Van a la lista de Brevo'),
  kpi('Con contraseña propia', g.conContrasena, 'El resto entra con enlace por email'),
].join('');
$('#kVentas').innerHTML = [
  kpi('Facturado en pesos', ars(inn.ars), ars(inn.ars30) + ' en los últimos 30 días', 'acid'),
  kpi('Facturado en dólares', usd(inn.usd), usd(inn.usd30) + ' en los últimos 30 días', 'blue'),
  kpi('Pedidos pagados', pe.pagados, pe.pendientes + ' sin acreditar'),
  kpi('Ticket promedio', ars(inn.ticketArs), 'Sobre las compras en pesos'),
].join('');

$('#tProd').innerHTML = '<thead><tr><th>Producto</th><th>Estado</th><th>Archivo</th><th class="num">Precio</th><th class="num">Unidades</th><th class="num">Facturado</th></tr></thead><tbody>'
  + data.productos.map(p => '<tr>'
    + '<td><span class="mono">' + esc(p.code) + '</span><br><b>' + esc(p.name) + '</b></td>'
    + '<td>' + (p.soon ? '<span class="tag tag-soft">Próximamente</span>' : '<span class="tag tag-ok">A la venta</span>') + '</td>'
    + '<td>' + (p.archivo ? '<span class="tag tag-soft">' + (p.archivo === 'panel' ? 'Cargado acá' : 'En Vercel') + '</span>' : '<span class="tag tag-pend">Falta</span>') + '</td>'
    + '<td class="num">' + usd(p.usd) + '<br><span class="mono">' + ars(p.ars) + '</span></td>'
    + '<td class="num">' + p.unidades + '</td>'
    + '<td class="num">' + (p.ars_vendido ? ars(p.ars_vendido) : '—') + (p.usd_vendido ? '<br><span class="mono">' + usd(p.usd_vendido) + '</span>' : '') + '</td>'
    + '</tr>').join('') + '</tbody>';

/* ── personas ── */
$('#gCount').textContent = g.total + ' en total · se muestran las ' + Math.min(25, data.ultimaGente.length) + ' más recientes';
$('#tGente').innerHTML = '<thead><tr><th>Email</th><th>Nombre</th><th>Alta</th><th>Novedades</th><th>Acceso</th></tr></thead><tbody>'
  + (data.ultimaGente.length ? data.ultimaGente.map(u => '<tr>'
    + '<td>' + esc(u.email) + '</td>'
    + '<td>' + (esc(u.name) || '<span class="mono">—</span>') + '</td>'
    + '<td><span class="mono">' + fecha(u.createdAt) + '</span></td>'
    + '<td>' + (u.news ? '<span class="tag tag-ok">Sí</span>' : '<span class="tag tag-soft">No</span>') + '</td>'
    + '<td><span class="mono">' + (u.conClave ? 'Contraseña' : 'Enlace por email') + '</span></td>'
    + '</tr>').join('') : '<tr><td colspan="5" style="opacity:.5">Todavía no hay cuentas creadas.</td></tr>') + '</tbody>';

/* ── pedidos ── */
$('#pCount').textContent = pe.total + ' en total · ' + pe.pagados + ' pagados';
$('#tPed').innerHTML = '<thead><tr><th>Pedido</th><th>Cliente</th><th>Productos</th><th>Medio</th><th>Estado</th><th>Comprobante</th><th class="num">Total</th></tr></thead><tbody>'
  + (data.ultimosPedidos.length ? data.ultimosPedidos.map(o => '<tr>'
    + '<td><span class="mono">' + esc(o.id) + '</span><br><span class="mono">' + fecha(o.fecha) + '</span></td>'
    + '<td>' + esc(o.email) + '</td>'
    + '<td>' + o.items.map(i => '<span class="mono">' + esc(i.code) + '</span> ' + esc(i.name) + (i.qty > 1 ? ' ×' + i.qty : '')).join('<br>') + '</td>'
    + '<td><span class="mono">' + (o.via === 'paypal' ? 'PayPal' : 'Mercado Pago') + '</span></td>'
    + '<td>' + (o.status === 'paid' ? '<span class="tag tag-ok">Pagado</span>' : '<span class="tag tag-pend">Pendiente</span>') + '</td>'
    + '<td>' + (o.status !== 'paid' ? '<span class="mono">—</span>'
        : '<span class="tag ' + (o.mail === 'ok' ? 'tag-ok' : o.mail ? 'tag-pend' : 'tag-soft') + '">'
          + (o.mail === 'ok' ? 'Enviado' : o.mail ? 'Falló' : 'Sin dato') + '</span>'
          + '<br><button class="alt-url" data-reenviar="' + esc(o.id) + '">Reenviar</button>'
          + '<span class="rmsg mono" data-para="' + esc(o.id) + '"></span>') + '</td>'
    + '<td class="num">' + (o.via === 'paypal' ? usd(o.usd) : ars(o.ars)) + '</td>'
    + '</tr>').join('') : '<tr><td colspan="7" style="opacity:.5">Todavía no hay pedidos.</td></tr>') + '</tbody>';

/* reenviar el comprobante de una compra */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-reenviar]');
  if (!b) return;
  const aviso = document.querySelector('.rmsg[data-para="' + b.dataset.reenviar + '"]');
  const antes = b.textContent;
  b.textContent = 'Enviando…'; b.disabled = true;
  try {
    const r = await fetch('/api/admin/reenviar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId: b.dataset.reenviar }) });
    const d = await r.json();
    if (aviso) { aviso.textContent = d.ok ? ' Enviado a ' + d.para : ' ' + (d.resultado || d.error || 'falló'); aviso.style.color = d.ok ? 'var(--ac)' : 'var(--or)'; }
  } catch (err) { if (aviso) { aviso.textContent = ' no se pudo'; aviso.style.color = 'var(--or)'; } }
  b.textContent = antes; b.disabled = false;
});

/* ── productos editables ── */
const cat = await (await fetch('/api/admin/catalog')).json();
$('#prods').innerHTML = cat.productos.map(p => `
  <form class="prod" data-id="${esc(p.id)}">
    <div class="head"><div><span class="mono dim">${esc(p.code)}</span><br><b>${esc(p.name)}</b></div>
      <span class="tag ${p.file ? 'tag-ok' : 'tag-pend'}">${p.file ? 'Archivo cargado' : 'Sin archivo'}</span></div>
    <div class="grid4">
      <div class="fld"><label>Nombre</label><input name="name" value="${esc(p.name)}" maxlength="80"></div>
      <div class="fld"><label>Precio USD</label><input name="usd" type="number" min="0" step="1" value="${p.usd}"><span class="tip">Lo que se muestra en el sitio y cobra PayPal</span></div>
      <div class="fld"><label>Precio ARS</label><input name="ars" type="number" min="0" step="1000" value="${p.ars}"><span class="tip">Lo que cobra Mercado Pago</span></div>
      <div class="fld"><label>Estado</label><select name="soon"><option value="false"${p.soon ? '' : ' selected'}>A la venta</option><option value="true"${p.soon ? ' selected' : ''}>Próximamente</option></select></div>
    </div>
    <div class="fld"><label>Bajada en español</label><textarea name="tes" maxlength="300">${esc(p.tagline?.es || '')}</textarea><span class="tip">Dejala vacía para usar el texto que ya está en el sitio</span></div>
    <div class="fld"><label>Bajada en inglés</label><textarea name="ten" maxlength="300">${esc(p.tagline?.en || '')}</textarea></div>
    <div class="fld">
      <label>Archivo que se descarga</label>
      <div class="drop" data-drop tabindex="0" role="button" aria-label="Subir archivo">
        <input type="file" class="fpick" hidden>
        <b class="dtitle">Arrastrá el archivo acá, o hacé clic para elegirlo</b>
        <span class="tip">Va directo a tu almacenamiento privado. Solo lo puede descargar quien compró el producto.</span>
        <div class="prog" hidden><i></i></div>
      </div>
      <span class="fstate${p.file ? ' ok' : ''}">${p.file ? (p.file.startsWith('blob:') ? 'Archivo subido: ' + esc(p.file.split('/').pop()) + (p.archivo ? (p.archivo.error ? ' — no lo encontramos en el almacenamiento' : ' · ' + peso(p.archivo.bytes) + ' · ' + esc(p.archivo.tipo || '')) : '') : 'Ahora usa una URL pegada a mano' + (p.fileFrom === 'vercel' ? ' (variable ' + esc(p.env) + ' en Vercel)' : '')) : 'Todavía no hay archivo cargado'}</span>
      <button type="button" class="alt-url">…o pegar una URL</button>
      <input name="file" value="${esc(p.file || '')}" placeholder="https://…/content-system.zip"${p.file && !p.file.startsWith('blob:') ? '' : ' hidden'}>
    </div>
    <div class="row-end"><p class="pmsg"></p><button class="btn btn-acid sm" type="submit">Guardar cambios <span class="ar">→</span></button></div>
  </form>`).join('');

/* ---- subir el archivo de un producto ---- */

async function subir(f, file) {
  const st = f.querySelector('.fstate'), prog = f.querySelector('.prog'), barra = f.querySelector('.prog i');
  const drop = f.querySelector('[data-drop]'), titulo = f.querySelector('.dtitle');
  st.className = 'fstate'; st.textContent = 'Preparando…';
  prog.hidden = false; barra.style.transform = 'scaleX(0)';
  try {
    const r = await fetch('/api/admin/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: f.dataset.id, filename: file.name, size: file.size }),
    });
    const d = await r.json();
    if (!d.ok) {
      prog.hidden = true;
      st.className = 'fstate err';
      st.textContent = d.error === 'blob_no_configurado'
        ? 'Falta crear el almacenamiento de archivos en Vercel (Storage → Create → Blob). Mientras tanto podés pegar una URL.'
        : d.error === 'archivo_muy_grande' ? 'El archivo pasa los 2 GB.'
        : 'No pudimos preparar la subida.';
      return;
    }
    titulo.textContent = 'Subiendo ' + file.name + ' (' + peso(file.size) + ')';
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('PUT', d.url, true);
      x.setRequestHeader('content-type', file.type || 'application/octet-stream');
      x.upload.onprogress = ev => {
        if (!ev.lengthComputable) return;
        const p = ev.loaded / ev.total;
        barra.style.transform = 'scaleX(' + p + ')';
        st.textContent = Math.round(p * 100) + '% subido';
      };
      x.onload = () => (x.status >= 200 && x.status < 300) ? ok() : fail(new Error('PUT ' + x.status + ' ' + x.responseText.slice(0, 120)));
      x.onerror = () => fail(new Error('red'));
      x.send(file);
    });
    barra.style.transform = 'scaleX(1)';
    f.querySelector('[name="file"]').value = d.ref;
    titulo.textContent = 'Arrastrá otro archivo para reemplazarlo';
    st.className = 'fstate ok'; st.textContent = 'Subido: ' + file.name + ' (' + peso(file.size) + '). Guardando…';
    f.requestSubmit();
    setTimeout(() => { prog.hidden = true; }, 900);
  } catch (err) {
    prog.hidden = true;
    st.className = 'fstate err';
    st.textContent = 'La subida falló. Probá de nuevo o pegá una URL. (' + String(err.message || err).slice(0, 80) + ')';
  }
  drop.classList.remove('over');
}

$$('#prods form').forEach(f => {
  const drop = f.querySelector('[data-drop]'), pick = f.querySelector('.fpick');
  drop.onclick = () => pick.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click(); } };
  pick.onchange = () => { if (pick.files[0]) subir(f, pick.files[0]); };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); if (ev === 'dragleave') drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const file = e.dataTransfer?.files?.[0]; if (file) subir(f, file); });
  f.querySelector('.alt-url').onclick = () => { const i = f.querySelector('[name="file"]'); i.hidden = !i.hidden; if (!i.hidden) i.focus(); };
});

$$('#prods form').forEach(f => f.addEventListener('submit', async e => {
  e.preventDefault();
  const m = f.querySelector('.pmsg'), btn = f.querySelector('button');
  const v = n => f.querySelector('[name="' + n + '"]').value;
  m.classList.remove('ok'); m.textContent = 'Guardando…';
  btn.disabled = true;
  try {
    const res = await fetch('/api/admin/catalog', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: f.dataset.id, name: v('name'), usd: v('usd'), ars: v('ars'), soon: v('soon') === 'true', file: v('file'), tagline: { es: v('tes'), en: v('ten') } }),
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error);
    m.classList.add('ok'); m.textContent = 'Guardado. El sitio lo toma en menos de dos minutos.';
    const tag = f.querySelector('.head .tag');
    tag.className = 'tag ' + (d.producto.file ? 'tag-ok' : 'tag-pend');
    tag.textContent = d.producto.file ? 'Archivo cargado' : 'Sin archivo';
    const st = f.querySelector('.fstate');
    if (d.producto.file) { st.className = 'fstate ok'; st.textContent = d.producto.file.startsWith('blob:') ? 'Archivo subido: ' + d.producto.file.split('/').pop() : 'Usa una URL pegada a mano'; }
  } catch (err) { m.textContent = 'No pudimos guardar. Probá de nuevo.'; }
  btn.disabled = false;
}));

/* ── pestañas ── */
$$('#rail button').forEach(b => b.onclick = () => {
  $$('#rail button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $$('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.tab));
});
})();
</script>
</body>
